name: Wuhan University notice digest

on:
  schedule:
    # GitHub cron uses UTC. The first run queues at 20:43 Beijing time,
    # prepares the runner, then waits locally until 22:00.
    - cron: '43 12 * * *'
    # Compensation attempts: 22:11, 22:41 and 23:11 Beijing time.
    - cron: '11 14 * * *'
    - cron: '41 14 * * *'
    - cron: '11 15 * * *'
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force a Feishu test message even if today was already delivered'
        required: false
        default: false
        type: boolean
      digest_day:
        description: 'Optional YYYY-MM-DD date to resend'
        required: false
        default: ''
        type: string
      diagnostic_only:
        description: 'Analyze without sending Feishu messages'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-digest-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install document parser
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Prepare scheduled send window
        id: send_window
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hhmm="$(TZ=Asia/Shanghai date +%H%M)"
          local_value=$((10#$local_hhmm))
          if [ "$local_value" -lt 2043 ] || [ "$local_value" -gt 2330 ]; then
            echo "Scheduled run is outside 20:43-23:30 Asia/Shanghai; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_SCHEDULE" = "43 12 * * *" ] && [ "$local_value" -lt 2200 ]; then
            target_epoch="$(TZ=Asia/Shanghai date -d "$(TZ=Asia/Shanghai date +%F) 22:00:00" +%s)"
            now_epoch="$(date +%s)"
            wait_seconds=$((target_epoch - now_epoch))
            if [ "$wait_seconds" -gt 0 ]; then
              echo "Runner ready; waiting ${wait_seconds}s for 22:00 Asia/Shanghai."
              sleep "$wait_seconds"
            fi
          fi

          local_hhmm="$(TZ=Asia/Shanghai date +%H%M)"
          local_value=$((10#$local_hhmm))
          if [ "$local_value" -lt 2200 ] || [ "$local_value" -gt 2330 ]; then
            echo "Send window is closed; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect and send daily digest
        if: ${{ steps.send_window.outputs.should_run == 'true' }}
        continue-on-error: ${{ inputs.diagnostic_only == true }}
        env:
          AI_PROVIDER: deepseek
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: deepseek-flash
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
          DIGEST_DAY: ${{ inputs.digest_day || '' }}
          DIAGNOSTIC_ONLY: ${{ inputs.diagnostic_only || 'false' }}
        run: |
          EXTRA_ARGS="--channels feishu --retention-days 90"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --skip-if-complete"
          fi
          if [ "$DIAGNOSTIC_ONLY" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --send"
          fi
          if [ "$FORCE_SEND" = "true" ] && [ "$DIAGNOSTIC_ONLY" != "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force-send"
          fi
          if [ -n "$DIGEST_DAY" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --digest-day $DIGEST_DAY"
          fi
          python scripts/daily_digest.py $EXTRA_ARGS
      - name: Notify unexpected workflow failure
        if: ${{ failure() && steps.send_window.outputs.should_run == 'true' && env.HEALTH_ALERT_SENT != 'true' && inputs.diagnostic_only != true }}
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: >-
          python scripts/send_health_alert.py
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Persist notice and delivery history
        if: always()
        run: |
          if [ -f data/state/notices.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state/notices.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m "Update notice digest state"
              git push
            fi
          fi
