name: Wuhan University notice digest

on:
  schedule:
    - cron: '7 22 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Collect and send daily digest
        run: python scripts/daily_digest.py --send --channels feishu
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      - name: Persist notice and delivery history
        if: always()
        run: |
          if [ -f data/state/notices.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state/notices.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m "Update notice digest state"
              git push
            fi
          fi
