name: Wuhan University notice digest

on:
  schedule:
    # GitHub cron uses UTC. 14:00 UTC = 22:00 Asia/Shanghai.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-digest-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install document parser
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Collect and send daily digest
        run: python scripts/daily_digest.py --send --channels feishu
        env:
          AI_PROVIDER: deepseek
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: deepseek-flash
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      - name: Persist notice and delivery history
        if: always()
        run: |
          if [ -f data/state/notices.sqlite3 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state/notices.sqlite3
            if ! git diff --cached --quiet; then
              git commit -m "Update notice digest state"
              git push
            fi
          fi
