name: Digest definition diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: digest-definition-diagnostic
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Confirm definition starts
        run: python --version
      - name: Exercise persistence shell
        if: always()
        run: |
          if [ -f data/state/notices.sqlite3 ]; then
            git status --short data/state/notices.sqlite3
          fi